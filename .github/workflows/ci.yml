name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-go@v5.1.0
        with:
          go-version: '1.22'
          cache: true

      - name: Tidy Dependencies
        run: go mod tidy

      - name: Build Server
        run: go build -v ./cmd/server

      - name: Test Suite
        run: go test -v ./...

