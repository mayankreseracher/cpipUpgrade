apiVersion: v1
kind: Service
metadata:
  name: cpip
  namespace: cpip
  labels:
    app: cpip
spec:
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app: cpip
