apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpip
  namespace: cpip
  labels:
    app: cpip
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpip
  template:
    metadata:
      labels:
        app: cpip
    spec:
      serviceAccountName: cpip
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: cpip
          image: cpip-upgrade:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9090
          env:
            - name: CPIP_HOST
              value: "0.0.0.0"
            - name: CPIP_PORT
              value: "8000"
            - name: LOG_LEVEL
              value: "INFO"
            - name: ENABLE_JWT_AUTH
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cpip-db
                  key: url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cpip-secrets
                  key: jwt-secret
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
