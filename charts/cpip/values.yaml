# Default values for cpip Helm chart

replicaCount: 2

image:
  repository: cpip-upgrade
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cpip.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - cpip
          topologyKey: kubernetes.io/hostname

# Environment configuration
env:
  CPIP_HOST: "0.0.0.0"
  CPIP_PORT: "8000"
  CPIP_DEBUG: "false"
  LOG_LEVEL: "INFO"
  ENABLE_JWT_AUTH: "true"
  TLS_ENABLED: "false"
  OTEL_ENABLED: "false"

# ConfigMap for application configuration
configMap:
  enabled: true
  data: {}

# Secrets for sensitive data
secrets:
  enabled: true
  data: {}

# Database configuration
database:
  enabled: true
  type: postgres
  host: postgres.default.svc.cluster.local
  port: 5432
  name: cpip
  username: cpip
  # password should be set via secrets
  poolSize: 20
  maxOverflow: 10

# Redis configuration
redis:
  enabled: true
  host: redis.default.svc.cluster.local
  port: 6379
  db: 0

# Health check probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

# Persistence for cache and logs
persistence:
  enabled: false
  storageClassName: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /data

# Pod Disruption Budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 1
