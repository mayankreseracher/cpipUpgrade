apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cpip.fullname" . }}
  labels:
    {{- include "cpip.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "cpip.selectorLabels" . | nindent 6 }}
